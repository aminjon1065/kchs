packages:
  - "apps/*"
  - "packages/*"

# pnpm 12: явный список пакетов, которым разрешены postinstall-скрипты
allowBuilds:
  "@biomejs/biome": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  turbo: true
  "@node-rs/argon2": true
  msgpackr-extract: true

# Транзитивные зависимости с исправленными уязвимостями — в пределах своей ветки
# версий: прямые родители (fastify, @fastify/swagger, imapflow, loaders.gl) ещё не
# подтянули исправление (разбор 03.11.2026)
overrides:
  "fast-uri@>=3.0.0 <3.1.9": ^3.1.9
  "fast-uri@>=4.0.0 <4.2.3": ^4.2.3
  "ip-address@<10.7.4": ^10.7.4
  "fflate@>=0.7.0 <0.7.5": ~0.7.5
  "source-map-js@>=1.0.0 <1.2.2": ^1.2.2
  "happy-dom@<21.0.4": ^21.0.4
  "vite@>=7.0.0 <7.3.7": ^7.3.7

# Разобранные уязвимости зависимостей. `pnpm audit --audit-level high` ломает
# сборку (17-security.md §5, ADR-0121), поэтому каждая строка здесь — разбор, а
# не тишина: почему в kchs уязвимый путь недостижим. Срок пересмотра и план
# обновления — вопрос N80 в docs/04-delivery/05-risks-and-open-questions.md.
auditConfig:
  ignoreGhsas:
    # tinypool 1.x (vitest 3 → пул воркеров тестов): загрязнение прототипа через
    # параметры воркера. Только запуск тестов, параметры задаёт сам vitest, чужого
    # ввода нет; исправление — в tinypool 2, то есть vitest 4+. Пересмотреть при
    # переходе на vitest 4 (разбор 03.11.2026).
    - GHSA-5gmw-xhrv-c9v3
    - GHSA-85c8-ppgw-ccpr
    # image-size <= 2.0.2 (deck.gl → loaders.gl → texture-compressor): сжатые
    # текстуры glTF мы не грузим, этот код в сборку web не попадает.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
