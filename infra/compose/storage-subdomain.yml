# Хранилище по HTTPS на своём имени и порту 443 — рабочая установка (ADR-0227).
# Браузер получает и загружает файлы по подписанным ссылкам напрямую (ADR-0044). Порт 443
# пропускает любой прокси организации, а отдельный порт (9443, storage-https.yml) типовой
# прокси с правилом CONNECT только на 443 не пропустит. Имя — KCHS_STORAGE_DOMAIN
# (обычно files.<домен портала>), сертификат Caddy выпускает на него сам; подпись SigV4
# сходится, потому что заголовок Host доходит до хранилища как есть.
# Подключается вторым файлом к infra/compose/docker-compose.yml (-f … -f …), пути — от
# каталога infra/compose; так её подключает infra/scripts/pilot.sh.
services:
  web:
    environment:
      KCHS_STORAGE_DOMAIN: ${KCHS_STORAGE_DOMAIN:?задайте KCHS_STORAGE_DOMAIN — имя хранилища, например files.<домен портала>}
    volumes:
      - ./caddy/sites-available/storage-subdomain.caddy:/etc/caddy/sites/storage-subdomain.caddy:ro
  # S3 по HTTP наружу не публикуется: браузер ходит в хранилище через Caddy
  minio:
    ports: !override
      - "${KCHS_BIND:-127.0.0.1}:${S3_PORT:-9000}:9000"
      - "${KCHS_BIND:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
