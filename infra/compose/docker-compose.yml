# kchs — инфраструктура сценария S1 (один сервер).
# Профили: по умолчанию — данные и сервисы (postgres, redis, minio, meilisearch,
# mailpit); `app` — образы api/worker/engine/web; `media` — LiveKit (фаза 4);
# `office` — сервер документов ONLYOFFICE (фаза 5); `observability` — трассы,
# метрики, журналы и оповещения (Alloy, Tempo, Loki, Prometheus, Grafana,
# экспортёры Postgres и Redis, Alertmanager).
# web — это Caddy со сборкой SPA: он отдаёт статику, проксирует /api и /ws,
# ставит CSP и выпускает TLS, поэтому отдельного прокси нет.
#
# Порты данных и служебных интерфейсов публикуются только на самом сервере
# (KCHS_BIND, по умолчанию 127.0.0.1); наружу — web и S3 (браузер загружает
# файлы и получает превью по подписанным ссылкам напрямую из хранилища).
name: kchs

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Окружение api и worker — одно на оба процесса, чтобы они не расходились
x-app-env: &app-env
  NODE_ENV: production
  TZ: ${TZ:-Asia/Dushanbe}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  KCHS_BASE_URL: ${KCHS_BASE_URL:-http://localhost:8080}
  KCHS_API_URL: ${KCHS_API_URL:-http://localhost:8080/api}
  DATABASE_URL: postgres://kchs_app:${KCHS_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-kchs}
  DATABASE_MIGRATOR_URL: postgres://kchs_migrator:${KCHS_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-kchs}
  DATABASE_QUERY_URL: postgres://kchs_query:${KCHS_QUERY_PASSWORD}@postgres:5432/${POSTGRES_DB:-kchs}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  MEILI_HOST: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
  KCHS_MASTER_KEY: ${KCHS_MASTER_KEY}
  KCHS_MASTER_KEY_PREVIOUS: ${KCHS_MASTER_KEY_PREVIOUS:-}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
  ENGINE_INTERNAL_URL: http://engine:8000
  # Версия установки — тег образов; видна в «Здоровье системы»
  KCHS_VERSION: ${KCHS_IMAGE_TAG:-0.1.0}
  # «Здоровье системы» читает метрики и оповещения профиля observability (ADR-0167);
  # профиль не запущен — экран так и пишет
  PROMETHEUS_URL: ${PROMETHEUS_URL_INTERNAL:-http://prometheus:9090}
  ALERTMANAGER_URL: ${ALERTMANAGER_URL_INTERNAL:-http://alertmanager:9093}
  SMTP_URL: ${SMTP_URL_INTERNAL:-smtp://mailpit:1025}
  SMTP_FROM: ${SMTP_FROM:-Портал КЧС <no-reply@kchs.local>}
  # Отправитель исходящих документов — ящик канцелярии (ADR-0149); пусто — SMTP_FROM
  DOCUMENTS_MAIL_FROM: ${DOCUMENTS_MAIL_FROM:-}
  # Почта в составе установки (профиль mail, ADR-0150): пусто — ящики не ведутся
  MAIL_DOMAIN: ${MAIL_DOMAIN:-}
  MAIL_CONFIG_DIR: ${MAIL_CONFIG_DIR_IN_APP:-}
  MAIL_SUBMISSION_URL: ${MAIL_SUBMISSION_URL_IN_APP:-}
  MAIL_IMAP_HOST: ${MAIL_IMAP_HOST_IN_APP:-}
  MAIL_IMAP_PORT: ${MAIL_IMAP_PORT_IN_APP:-993}
  MAIL_TLS_VERIFY: ${MAIL_TLS_VERIFY:-false}
  MAIL_WEBMAIL_URL: ${MAIL_WEBMAIL_URL:-}
  MAIL_REGISTRY_LOCAL: ${MAIL_REGISTRY_LOCAL:-kanc}
  SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-12}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
  LOGIN_RATE_LIMIT_PER_IP_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_IP_PER_MINUTE:-300}
  # Публичный API и вебхуки (ADR-0097)
  API_TOKEN_RATE_LIMIT_PER_MINUTE: ${API_TOKEN_RATE_LIMIT_PER_MINUTE:-600}
  WEBHOOKS_ALLOW_PRIVATE_ADDRESSES: ${WEBHOOKS_ALLOW_PRIVATE_ADDRESSES:-}
  WEBHOOK_RETRY_WINDOW_HOURS: ${WEBHOOK_RETRY_WINDOW_HOURS:-24}
  # Caddy (контейнер web) в частной сети Docker: X-Forwarded-For верим только ему
  TRUST_PROXY: ${TRUST_PROXY_APP:-uniquelocal}
  # Метрики Prometheus — отдельный порт во внутренней сети: не пробрасывается и не
  # проксируется web; трассы — в Alloy профиля observability (http://alloy:4318),
  # пустой адрес выключает их (ADR-0045)
  METRICS_PORT: 9464
  METRICS_HOST: 0.0.0.0
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT_INTERNAL:-}
  # Telegram-бот и ИИ (ADR-0061): пустые значения — функции выключены
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_API_URL: ${TELEGRAM_API_URL:-}
  TELEGRAM_POLLING: ${TELEGRAM_POLLING:-}
  AI_PROVIDER: ${AI_PROVIDER:-}
  AI_MODEL: ${AI_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
  OPENAI_COMPAT_URL: ${OPENAI_COMPAT_URL:-}
  OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
  AI_DAILY_REQUESTS: ${AI_DAILY_REQUESTS:-}
  AI_DAILY_TOKENS: ${AI_DAILY_TOKENS:-}
  AI_DOCUMENTS_MAX_CONFIDENTIALITY: ${AI_DOCUMENTS_MAX_CONFIDENTIALITY:-}
  # Совместное редактирование офисных файлов (ADR-0112): пустой адрес сервера
  # документов или пустой секрет — редактор выключен, кнопки нет. Адрес для
  # браузера публикуется профилем `office`; api ходит к нему за живостью по
  # внутреннему адресу, а сам сервер документов ходит в api за файлом
  ONLYOFFICE_URL: ${ONLYOFFICE_URL:-}
  ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL:-http://onlyoffice}
  ONLYOFFICE_CALLBACK_URL: ${ONLYOFFICE_CALLBACK_URL:-http://api:3000}
  ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
  # Подписки ICS на адреса внутренней сети (ADR-0081): пусто — запрещены
  CALENDAR_FEEDS_ALLOW_PRIVATE: ${CALENDAR_FEEDS_ALLOW_PRIVATE:-}
  # Исходящий прокси (ADR-0132): ленты, подложки, ГИС-службы, ICS и вызовы api
  # наружу; службы установки идут мимо него сами. Пусто — запросы напрямую
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  # Push-уведомления браузера (ADR-0094): пустые ключи — push выключен
  PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
  PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
  PUSH_CONTACT: ${PUSH_CONTACT:-}
  # Медиасервер встреч (ADR-0089): пустые значения — встречи выключены
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  # Запись встреч (ADR-0092): Egress кладёт файл в хранилище сам и сообщает о
  # готовности вебхуком — оба адреса видны из его сети, а не из браузера
  S3_EGRESS_ENDPOINT: ${S3_EGRESS_ENDPOINT:-http://minio:9000}
  LIVEKIT_WEBHOOK_URL: ${LIVEKIT_WEBHOOK_URL:-http://api:3000/api/v1/meetings/webhooks/livekit}

services:
  postgres:
    <<: [*restart, *logging]
    build:
      context: ./postgres
    image: kchs/postgres:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kchs}
      KCHS_APP_PASSWORD: ${KCHS_APP_PASSWORD:?set KCHS_APP_PASSWORD}
      KCHS_MIGRATOR_PASSWORD: ${KCHS_MIGRATOR_PASSWORD:?set KCHS_MIGRATOR_PASSWORD}
      KCHS_QUERY_PASSWORD: ${KCHS_QUERY_PASSWORD:?set KCHS_QUERY_PASSWORD}
      KCHS_READONLY_PASSWORD: ${KCHS_READONLY_PASSWORD:-readonly}
      KCHS_AUDIT_PASSWORD: ${KCHS_AUDIT_PASSWORD:-audit}
      # Русская сортировка и поиск без учёта регистра
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      TZ: ${TZ:-Asia/Dushanbe}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=2GB
      - -c
      - random_page_cost=1.1
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${KCHS_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-kchs}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # Предел памяти: без него Redis растёт до памяти сервера. noeviction обязателен —
      # в Redis очереди BullMQ и поток событий: у предела запись отклоняется, ключи не
      # вытесняются (оповещение KchsRedisMemory — на 90%)
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "${KCHS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    <<: [*restart, *logging]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
    volumes:
      - miniodata:/data
    ports:
      # S3 — наружу: браузер ходит в хранилище по подписанным ссылкам
      - "${S3_PORT:-9000}:9000"
      - "${KCHS_BIND:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mc alias set kchs http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        for b in kchs-files kchs-previews kchs-media kchs-exports kchs-tiles kchs-backups kchs-columnar; do
          mc mb --ignore-existing "kchs/$$b"
        done
        mc ilm rule add --expire-days 30 kchs/kchs-exports 2>/dev/null || true
        echo "kchs: бакеты готовы"
    restart: "no"

  meilisearch:
    <<: [*restart, *logging]
    image: getmeili/meilisearch:v1.53
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
      MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
    volumes:
      - meilidata:/meili_data
    ports:
      - "${KCHS_BIND:-127.0.0.1}:${MEILI_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20


  # Почта разработки: SMTP-приёмник с веб-интерфейсом (SMTP_URL=smtp://mailpit:1025)
  mailpit:
    <<: [*restart, *logging]
    image: axllent/mailpit:v1.28
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${KCHS_BIND:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${KCHS_BIND:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8025/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Профиль mail: почта Комитета (ADR-0150) ──────────────────────────────
  # docker-mailserver (Postfix + Dovecot + OpenDKIM) и веб-почта Roundcube. Ящики
  # сотрудников и канцелярии ведёт платформа: `kchs mail sync` пишет файл учёток
  # postfix-accounts.cf в каталог настроек сервера, сервер подхватывает его сам.
  # Поднимается отдельно: docker compose --profile mail up -d --wait
  mail-init:
    profiles: ["mail"]
    image: alpine/openssl:3.5.4
    # Самоподписанный сертификат для закрытого контура и тестового домена: с доменом
    # Комитета его заменяет настоящий (docs/06-guides/31-admin-mail.md)
    entrypoint:
      - sh
      - -c
      - |
        set -e
        dir=/config/ssl
        name="$$MAIL_HOSTNAME"
        mkdir -p "$$dir/demoCA"
        if [ ! -f "$$dir/$$name-cert.pem" ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -subj "/CN=$$name" -addext "subjectAltName=DNS:$$name,DNS:mailserver" \
            -keyout "$$dir/$$name-key.pem" -out "$$dir/$$name-cert.pem"
          cp "$$dir/$$name-cert.pem" "$$dir/demoCA/cacert.pem"
        fi
        touch /config/postfix-accounts.cf
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.kchs.test}
    volumes:
      - ${MAIL_CONFIG_VOLUME:-mailconfig}:/config

  mailserver:
    <<: [*restart, *logging]
    profiles: ["mail"]
    image: mailserver/docker-mailserver:16.0.1
    hostname: ${MAIL_HOSTNAME:-mail.kchs.test}
    environment:
      OVERRIDE_HOSTNAME: ${MAIL_HOSTNAME:-mail.kchs.test}
      ONE_DIR: "1"
      SSL_TYPE: self-signed
      # Отправка от имени платформы (api, worker) и веб-почты — только с паролем
      PERMIT_DOCKER: none
      SPOOF_PROTECTION: "1"
      ENABLE_OPENDKIM: "1"
      ENABLE_OPENDMARC: "1"
      ENABLE_SPAMASSASSIN: "0"
      ENABLE_CLAMAV: "0"
      ENABLE_AMAVIS: "0"
      ENABLE_FAIL2BAN: "0"
      ENABLE_POSTGREY: "0"
      ENABLE_UPDATE_CHECK: "0"
      POSTFIX_MESSAGE_SIZE_LIMIT: "31457280"
      # Исходящие наружу — через ретранслятор провайдера, если прямой порт 25 закрыт
      DEFAULT_RELAY_HOST: ${MAIL_RELAY_HOST:-}
      LOG_LEVEL: warn
    volumes:
      - ${MAIL_CONFIG_VOLUME:-mailconfig}:/tmp/docker-mailserver
      - maildata:/var/mail
      - mailstate:/var/mail-state
    ports:
      # 25 — приём почты из интернета; 587 и 993 — почтовые программы сотрудников
      - "${MAIL_BIND:-127.0.0.1}:${MAIL_SMTP_PORT:-2525}:25"
      - "${MAIL_BIND:-127.0.0.1}:${MAIL_SUBMISSION_PORT:-5587}:587"
      - "${MAIL_BIND:-127.0.0.1}:${MAIL_IMAPS_PORT:-9993}:993"
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':25 ' && ss -lnt | grep -q ':993 '"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      mail-init: { condition: service_completed_successfully }

  webmail:
    <<: [*restart, *logging]
    profiles: ["mail"]
    image: roundcube/roundcubemail:1.7.4-apache
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mailserver
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mailserver
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
    volumes:
      - ./mail/roundcube.inc.php:/var/roundcube/config/kchs.inc.php:ro
      - webmaildata:/var/roundcube/db
    ports:
      - "${KCHS_BIND:-127.0.0.1}:${WEBMAIL_PORT:-8083}:80"
    depends_on:
      mailserver: { condition: service_healthy }

  # ── Профиль app: образы приложения (полное развёртывание) ─────────────────
  api:
    <<: [*restart, *logging]
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: kchs/api:${KCHS_IMAGE_TAG:-0.1.0}
    environment:
      <<: *app-env
      ROLE: api
      PORT: 3000
      # Первый администратор для `docker compose exec api kchs init`
      KCHS_ADMIN_LOGIN: ${KCHS_ADMIN_LOGIN:-admin}
      KCHS_ADMIN_EMAIL: ${KCHS_ADMIN_EMAIL:-}
      # Пароли демо-учёток для `kchs seed` (стенд демонстрации, ADR-0148): свои у стенда,
      # пусто — встроенные, известные всем, кто видел код
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    # Каталог настроек почтового сервера: сюда платформа пишет файл учёток (ADR-0150)
    volumes:
      - ${MAIL_CONFIG_VOLUME:-mailconfig}:/var/lib/kchs/mail
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      meilisearch: { condition: service_healthy }
    # Снаружи api доступен только через web (Caddy); порт открыт лишь на самом сервере
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  worker:
    <<: [*restart, *logging]
    profiles: ["app"]
    image: kchs/api:${KCHS_IMAGE_TAG:-0.1.0}
    environment:
      <<: *app-env
      ROLE: worker
    # HTTP-сервера у worker нет: живость — по файлу, который он обновляет раз в 10 с
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/kchs-worker.alive && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/kchs-worker.alive) )) -lt 60
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Каталог настроек почтового сервера: сюда платформа пишет файл учёток (ADR-0150)
    volumes:
      - ${MAIL_CONFIG_VOLUME:-mailconfig}:/var/lib/kchs/mail
    depends_on:
      # Миграции и системные роли готовит api при старте
      api: { condition: service_healthy }

  engine:
    <<: [*restart, *logging]
    profiles: ["app"]
    build:
      context: ../../apps/engine
      dockerfile: Dockerfile
    image: kchs/engine:${KCHS_IMAGE_TAG:-0.1.0}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgres://kchs_app:${KCHS_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-kchs}
      # Колоночные копии датасетов (ADR-0109) движок читает ролью только для
      # чтения таблиц строк (ADR-0048)
      DATABASE_QUERY_URL: postgres://kchs_query:${KCHS_QUERY_PASSWORD}@postgres:5432/${POSTGRES_DB:-kchs}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Обратные вызовы движка в api: в полном развёртывании — контейнер api;
      # при разработке (api на хосте) — http://host.docker.internal:3000
      KCHS_API_URL: ${ENGINE_API_URL:-http://api:3000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      # Веб для страницы печати отчётов в Chromium движка (ADR-0078): в полном
      # развёртывании — контейнер web; при разработке — http://host.docker.internal:5173
      KCHS_WEB_URL: ${ENGINE_WEB_URL:-http://web}
      # Расшифровка записей встреч (ADR-0092): пустая модель — функция выключена,
      # api получает «недоступно». Веса скачиваются при первом задании
      ENGINE_TRANSCRIBE_MODEL: ${ENGINE_TRANSCRIBE_MODEL:-}
      ENGINE_TRANSCRIBE_DEVICE: ${ENGINE_TRANSCRIBE_DEVICE:-cpu}
      ENGINE_TRANSCRIBE_COMPUTE: ${ENGINE_TRANSCRIBE_COMPUTE:-int8}
      ENGINE_TRANSCRIBE_LANGUAGE: ${ENGINE_TRANSCRIBE_LANGUAGE:-}
      # Колоночный tier (ADR-0109): кэш файлов Parquet на диске движка и пределы
      # DuckDB. Каталог по умолчанию — временный, он живёт вместе с контейнером
      ENGINE_COLUMNAR_CACHE_DIR: ${ENGINE_COLUMNAR_CACHE_DIR:-}
      ENGINE_COLUMNAR_CACHE_MB: ${ENGINE_COLUMNAR_CACHE_MB:-4096}
      ENGINE_COLUMNAR_THREADS: ${ENGINE_COLUMNAR_THREADS:-4}
      ENGINE_COLUMNAR_MEMORY_MB: ${ENGINE_COLUMNAR_MEMORY_MB:-2048}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    # Внутренний HTTP движка (шаблоны, /health) — только с самого сервера, как у api
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8000}:8000"

  # Вход в систему: Caddy со сборкой SPA (apps/web/Dockerfile) — статика, прокси
  # /api и /ws, CSP (ADR-0043), TLS. KCHS_DOMAIN=:80 — HTTP без сертификата
  # (стенд, внутренняя сеть за своим TLS); домен — автоматический HTTPS, тогда
  # WEB_PORT=80 и WEB_HTTPS_PORT=443
  web:
    <<: [*restart, *logging]
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: kchs/web:${KCHS_IMAGE_TAG:-0.1.0}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      KCHS_DOMAIN: ${KCHS_DOMAIN:-:80}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.org}
      # Origin S3 для CSP: прямые загрузки и превью по подписанным ссылкам (ADR-0043)
      KCHS_STORAGE_ORIGIN: ${KCHS_STORAGE_ORIGIN:-http://localhost:9000}
      # Медиасервер встреч: браузер подключается к нему напрямую (ADR-0089)
      KCHS_MEDIA_ORIGIN: ${KCHS_MEDIA_ORIGIN:-}
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2020/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api: { condition: service_healthy }

  # ── Профиль office: совместное редактирование офисных файлов (ADR-0112) ────
  # Сервер документов ONLYOFFICE: браузер грузит с него редактор, а он сам ходит
  # в api за содержимым версии и возвращает правку колбэком. Оба направления
  # подписаны общим секретом ONLYOFFICE_JWT_SECRET; без него редактор выключен.
  # Поднимается отдельно: docker compose --profile office up -d onlyoffice
  onlyoffice:
    <<: [*restart, *logging]
    profiles: ["office"]
    image: onlyoffice/documentserver:9.4
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      JWT_HEADER: Authorization
      # api живёт в частной сети (api:3000, host.docker.internal): своя защита
      # сервера документов от частных адресов иначе не пустила бы его к файлу
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
      USE_UNAUTHORIZED_STORAGE: "false"
    volumes:
      - onlyofficedata:/var/www/onlyoffice/Data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${KCHS_BIND:-127.0.0.1}:${ONLYOFFICE_PORT:-8082}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  # ── Профиль media: аудио/видео встреч (ADR-0089) ───────────────────────────
  # Ключ и секрет — из .env (generate-secrets.sh); api выпускает по ним токены
  # комнат, браузер подключается к :7880 напрямую.
  # На стенде разработчика (Docker Desktop) узел объявляет клиентам адрес
  # контейнера, и браузер на хосте до потока не доходит: тогда задаётся
  # LIVEKIT_NODE_IP=127.0.0.1. В установке узел определяет адрес сам.
  livekit:
    <<: [*restart, *logging]
    profiles: ["media"]
    image: livekit/livekit-server:v1.8
    command: --config /etc/livekit.yaml ${LIVEKIT_NODE_IP:+--node-ip ${LIVEKIT_NODE_IP}}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # Задания записи медиасервер передаёт Egress через Redis — тот же, что у
      # api; без него запись недоступна (ADR-0092). Ключами конфигурации это не
      # задать: файл монтируется как есть, а подстановки в нём нет
      REDIS_HOST: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Запись встреч (ADR-0092): Egress забирает задания из Redis, сводит комнату
  # в mp4 и кладёт файл прямо в бакет файлов под ключ, выданный api. О
  # готовности он сообщает вебхуком с подписью ключом установки.
  livekit-egress:
    <<: [*restart, *logging]
    profiles: ["media"]
    image: livekit/egress:v1.9
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: true
        log_level: info
    # Chromium записи комнаты нужен разделяемый сегмент памяти
    shm_size: 1gb
    # Сетевые пространства имён Chromium: без этого запись падает на старте
    cap_add:
      - SYS_ADMIN
    depends_on:
      redis: { condition: service_healthy }

  # ── Профиль observability: трассы, метрики, журналы (15-admin-operations.md §4,
  # ADR-0045). Трассы включает OTEL_EXPORTER_OTLP_ENDPOINT_INTERNAL=http://alloy:4318
  # (api/worker профиля app) или OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  # (api на хосте). Grafana — http://127.0.0.1:3001, Alertmanager — :9093; наружу
  # не публикуются. Метрики служб данных и доставка оповещений — ADR-0147.
  alloy:
    <<: [*restart, *logging]
    profiles: ["observability"]
    image: grafana/alloy:v1.12.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # Журналы собираются только с контейнеров своего проекта
      KCHS_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-kchs}
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Журналы контейнеров — через API Docker, только чтение
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    ports:
      # OTLP/HTTP для api на хосте; контейнеры пишут в alloy:4318
      - "${KCHS_BIND:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"
    depends_on: [tempo, loki]

  # Tempo и Loki работают от uid 10001, а новый том принадлежит root
  observability-init:
    profiles: ["observability"]
    image: busybox:1.37
    command: ["chown", "-R", "10001:10001", "/var/tempo", "/loki"]
    volumes:
      - tempodata:/var/tempo
      - lokidata:/loki
    restart: "no"

  tempo:
    <<: [*restart, *logging]
    profiles: ["observability"]
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    depends_on:
      observability-init: { condition: service_completed_successfully }

  loki:
    <<: [*restart, *logging]
    profiles: ["observability"]
    image: grafana/loki:3.6.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    depends_on:
      observability-init: { condition: service_completed_successfully }

  prometheus:
    <<: [*restart, *logging]
    profiles: ["observability"]
    image: prom/prometheus:v3.9.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
      # Токены метрик MinIO и Meilisearch (metrics-init-*): читаются при каждом опросе
      - prometheussecrets:/etc/prometheus-secrets:ro

  # ── Метрики служб данных (ADR-0147) ────────────────────────────────────────
  # Учётные записи только для чтения метрик заводятся при каждом запуске профиля:
  # роль БД kchs_monitor (pg_monitor), пользователь MinIO с правом admin:Prometheus,
  # ключ Meilisearch с действием metrics.get. Токены — в томе prometheussecrets.
  metrics-init-postgres:
    profiles: ["observability"]
    image: postgres:17-bookworm
    entrypoint: ["bash", "/scripts/postgres.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-}
      PGDATABASE: ${POSTGRES_DB:-kchs}
      KCHS_MONITOR_PASSWORD: ${KCHS_MONITOR_PASSWORD:-}
    volumes:
      - ../observability/secrets:/scripts:ro
      - prometheussecrets:/secrets
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  metrics-init-minio:
    profiles: ["observability"]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["bash", "/scripts/minio.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - ../observability/secrets:/scripts:ro
      - prometheussecrets:/secrets
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  metrics-init-meilisearch:
    profiles: ["observability"]
    image: busybox:1.37
    entrypoint: ["sh", "/scripts/meilisearch.sh"]
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    volumes:
      - ../observability/secrets:/scripts:ro
      - prometheussecrets:/secrets
    depends_on:
      meilisearch: { condition: service_healthy }
    restart: "no"

  # Postgres: активность и длинные транзакции, соединения, размер баз, WAL,
  # блокировки. Потабличные сборщики выключены: у каждого датасета своя таблица в
  # схеме ds, и их число растёт вместе с данными — метрики разрослись бы вслед
  postgres-exporter:
    <<: [*restart, *logging]
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    command:
      - --collector.long_running_transactions
      - --collector.database_wraparound
      - --collector.stat_checkpointer
      - --collector.postmaster
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-kchs}?sslmode=disable
      DATA_SOURCE_USER: kchs_monitor
      DATA_SOURCE_PASS_FILE: /secrets/postgres-password
    volumes:
      - prometheussecrets:/secrets:ro
    depends_on:
      # Пароль в .env сменили — роль пересоздана, экспортёр перечитывает файл
      metrics-init-postgres: { condition: service_completed_successfully, restart: true }

  redis-exporter:
    <<: [*restart, *logging]
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.91.1
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  # ── Оповещения (ADR-0147): правила Prometheus → Alertmanager → почта и Telegram ─
  # Конфигурация собирается при старте из переменных (entrypoint.sh): SMTP — тот же,
  # что у api и worker; получатели — ALERTMANAGER_EMAIL_TO; Telegram — по желанию,
  # бот по умолчанию тот же, что у платформы. Интерфейс — http://127.0.0.1:9093
  alertmanager:
    <<: [*restart, *logging]
    profiles: ["observability"]
    image: prom/alertmanager:v0.34.1
    entrypoint: ["sh", "/etc/alertmanager-kchs/entrypoint.sh"]
    environment:
      TZ: ${TZ:-Asia/Dushanbe}
      ALERTMANAGER_EMAIL_TO: ${ALERTMANAGER_EMAIL_TO:-}
      ALERTMANAGER_SMTP_URL: ${ALERTMANAGER_SMTP_URL:-${SMTP_URL_INTERNAL:-smtp://mailpit:1025}}
      ALERTMANAGER_SMTP_FROM: ${ALERTMANAGER_SMTP_FROM:-${SMTP_FROM:-Портал КЧС <no-reply@kchs.local>}}
      ALERTMANAGER_SMTP_REQUIRE_TLS: ${ALERTMANAGER_SMTP_REQUIRE_TLS:-}
      ALERTMANAGER_TELEGRAM_BOT_TOKEN: ${ALERTMANAGER_TELEGRAM_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      ALERTMANAGER_TELEGRAM_CHAT_ID: ${ALERTMANAGER_TELEGRAM_CHAT_ID:-}
      ALERTMANAGER_TELEGRAM_API_URL: ${ALERTMANAGER_TELEGRAM_API_URL:-${TELEGRAM_API_URL:-}}
      ALERTMANAGER_INSTALLATION: ${ALERTMANAGER_INSTALLATION:-Портал КЧС}
      ALERTMANAGER_EXTERNAL_URL: ${ALERTMANAGER_EXTERNAL_URL:-http://127.0.0.1:9093}
      # Telegram из закрытого контура — через исходящий прокси установки (ADR-0132)
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - ../observability/alertmanager:/etc/alertmanager-kchs:ro
      - alertmanagerdata:/alertmanager
    ports:
      - "${KCHS_BIND:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    <<: [*restart, *logging]
    profiles: ["observability"]
    image: grafana/grafana:12.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${KCHS_BIND:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    depends_on: [prometheus, tempo, loki]

volumes:
  pgdata:
  redisdata:
  miniodata:
  meilidata:
  caddydata:
  caddyconfig:
  alloydata:
  tempodata:
  lokidata:
  prometheusdata:
  prometheussecrets:
  alertmanagerdata:
  grafanadata:
  onlyofficedata:
  mailconfig:
  maildata:
  mailstate:
  webmaildata:
