# Правила ZAP baseline, разобранные для kchs (17-security.md §8).
#
# Формат строки: <номер правила><TAB>IGNORE|WARN|FAIL<TAB>(пояснение).
# Правил, которых здесь нет, прогон не прощает: и WARN, и FAIL роняют сборку —
# значит, каждая строка ниже это осознанное решение, а не тишина. Новое
# замечание либо чинится, либо попадает сюда с объяснением и датой разбора.
#
# Разобрано 2026-09-20 на установке за Caddy (профиль app) и на стенде
# разработки (профиль dev, дополнение в zap-baseline-dev.conf).

10027	IGNORE	(Suspicious Comments: слова вроде «query», «admin», «from» внутри минифицированных чанков сборки web. Комментариев исходников в сборке нет — vite их вырезает; правило срабатывает на строковые литералы библиотек.)
10049	IGNORE	(Non-Storable / Storable but Non-Cacheable Content: страницы с nonce отдаются с `Cache-Control: no-store` намеренно — страница из кеша несла бы nonce, не совпадающий с заголовком CSP (ADR-0043). Файлы `/assets/*` с хешем в имени кешируются навсегда.)
10096	IGNORE	(Timestamp Disclosure: число в чанке сборки, похожее на unix-время. Ни времени сервера, ни данных пользователя оно не раскрывает.)
10109	IGNORE	(Modern Web Application: сообщение о том, что приложение — SPA и обычный паук найдёт не все адреса. Это описание kchs, а не замечание; поверхность API проверяется отдельной целью `/api/docs` и интеграционными тестами доступа.)
90004	IGNORE	(Cross-Origin-Embedder-Policy: `require-corp` потребовал бы заголовка `Cross-Origin-Resource-Policy` от каждого стороннего происхождения — подписанных ссылок S3, превью и медиасервера встреч. Ни MinIO, ни LiveKit его не ставят, и включение COEP сломало бы загрузки и запись встреч. Изоляция окна закрыта `Cross-Origin-Opener-Policy: same-origin`, ресурсы api — `Cross-Origin-Resource-Policy: same-site`.)
