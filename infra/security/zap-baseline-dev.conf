# Дополнение к zap-baseline.conf для профиля `dev` — стенда разработки.
#
# На стенде web отдаёт vite (:5173), а api слушает :3000 напрямую: Caddy, который
# в установке ставит заголовки безопасности (ADR-0043, infra/compose/caddy/
# Caddyfile), в этой цепочке нет. Поэтому правила ниже на стенде срабатывают
# всегда и ничего не говорят о продукте — настоящую проверку этих заголовков
# делают профиль `app` (вся установка за Caddy) и `pnpm --filter @kchs/web
# csp:check` на каждом PR.
#
# В профиле `app` этот файл не подключается: там те же правила обязаны проходить.

10020	IGNORE	(Anti-clickjacking: `X-Frame-Options: DENY` и `frame-ancestors 'none'` ставит Caddy. На стенде vite отдаёт страницу без них.)
10021	IGNORE	(X-Content-Type-Options: `nosniff` ставит Caddy для статики; ответы api его ставят сами (helmet) и здесь не участвуют.)
10038	IGNORE	(CSP: строгая политика с nonce запроса собирается в Caddyfile и подставляется в `index.html` шаблоном. Vite отдаёт страницу без CSP.)
10063	IGNORE	(Permissions-Policy: заголовок ставит Caddy.)
