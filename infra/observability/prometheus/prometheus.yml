# Prometheus — метрики kchs (15-admin-operations.md §4, ADR-0045). Эндпоинты
# /metrics api и worker (METRICS_PORT=9464) доступны только во внутренней сети
# compose: порт не пробрасывается и не проксируется Caddy.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Доставка оповещений — Alertmanager профиля observability (ADR-0147): почта и
# Telegram. Не запущен — оповещения видны в /alerts, Prometheus работает дальше
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # Все экземпляры сервиса (api ×2 в S1) — через DNS compose; сервис не
  # запущен — целей нет, а не «цель недоступна»
  - job_name: kchs-api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9464

  - job_name: kchs-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9464

  # Разработка: api на хосте (pnpm dev c METRICS_PORT=9464). Имя есть только
  # в Docker Desktop; на сервере Linux оно не разрешается — целей нет
  - job_name: kchs-dev
    dns_sd_configs:
      - names: [host.docker.internal]
        type: A
        port: 9464

  # ── Службы данных (ADR-0147). instance — имя службы, а не адрес экспортёра:
  # так его видно в оповещениях и по нему подавляются предупреждения при падении
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels: { instance: postgres }

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
        labels: { instance: redis }

  # Собственные метрики MinIO: токен пользователя только с правом admin:Prometheus
  # (metrics-init-minio). Кластерные метрики тяжелее прочих — раз в 30 с
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    scrape_interval: 30s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus-secrets/minio-token
    static_configs:
      - targets: [minio:9000]
        labels: { instance: minio }

  # /metrics Meilisearch (экспериментальная функция включена в сервисе) — ключ только
  # с действием metrics.get (metrics-init-meilisearch)
  - job_name: meilisearch
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus-secrets/meilisearch-key
    static_configs:
      - targets: [meilisearch:7700]
        labels: { instance: meilisearch }

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
        labels: { instance: alertmanager }

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
