{{- if .Values.postgres.embedded.enabled }}
{{/*
Встроенный Postgres — только для тестового кластера (ADR-0118): один под, без
репликации, PgBouncer и непрерывного архива WAL. Образ тот же, что в compose
(infra/compose/postgres): PostGIS 3.5 + pgvector и бутстрап-скрипт, который
создаёт роли kchs_app / kchs_migrator / kchs_query / kchs_readonly / kchs_audit
с минимальными привилегиями (05-data-model.md, 17-security.md §4).
Промышленная установка ставит кластер оператором (CloudNativePG, Patroni) и
указывает его адрес в postgres.host.
*/}}
{{- $fullname := include "kchs.fullname" . -}}
{{- $pg := .Values.postgres.embedded -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "kchs.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
  selector:
    {{- include "kchs.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "kchs.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "kchs.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kchs.componentLabels" (dict "ctx" . "component" "postgres") | nindent 8 }}
    spec:
      {{- include "kchs.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "kchs.image" (dict "ctx" . "image" $pg.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - postgres
            {{- range $key, $value := $pg.parameters }}
            - -c
            - {{ printf "%s=%s" $key $value | quote }}
            {{- end }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: POSTGRES_INITDB_ARGS
              value: "--locale=C.UTF-8 --encoding=UTF8"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kchs.secretName" . }}
                  key: {{ $pg.superuserSecretKey }}
            {{- range $var, $key := dict "KCHS_APP_PASSWORD" "POSTGRES_APP_PASSWORD" "KCHS_MIGRATOR_PASSWORD" "POSTGRES_MIGRATOR_PASSWORD" "KCHS_QUERY_PASSWORD" "POSTGRES_QUERY_PASSWORD" "KCHS_READONLY_PASSWORD" "POSTGRES_READONLY_PASSWORD" "KCHS_AUDIT_PASSWORD" "POSTGRES_AUDIT_PASSWORD" }}
            - name: {{ $var }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "kchs.secretName" $ }}
                  key: {{ $key }}
            {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
        {{- if not $pg.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $pg.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $pg.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
  {{- end }}
{{- end }}
