{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kchs.serviceAccountName" . }}
  labels:
    {{- include "kchs.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Ни один процесс kchs не обращается к API Kubernetes
automountServiceAccountToken: false
{{- end }}
