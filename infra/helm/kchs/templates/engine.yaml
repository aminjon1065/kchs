{{- if .Values.engine.enabled }}
{{- $fullname := include "kchs.fullname" . -}}
{{- $auto := .Values.engine.autoscaling -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-engine
  labels:
    {{- include "kchs.componentLabels" (dict "ctx" . "component" "engine") | nindent 4 }}
spec:
  {{- if eq $auto.mode "off" }}
  replicas: {{ .Values.engine.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kchs.selectorLabels" (dict "ctx" . "component" "engine") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "kchs.componentLabels" (dict "ctx" . "component" "engine") | nindent 8 }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        {{- with .Values.engine.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "kchs.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "kchs.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Расшифровка, сборка колоночных копий и печать отчётов идут минутами
      terminationGracePeriodSeconds: 120
      containers:
        - name: engine
          image: {{ include "kchs.image" (dict "ctx" . "image" .Values.engine.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: NODE_ENV
              value: production
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # Движок читает таблицы строк ролью только для чтения (ADR-0048)
            {{- include "kchs.dbEnv" (dict "ctx" . "roles" (list "app" "query")) | nindent 12 }}
            {{- include "kchs.redisEnv" (dict "ctx" .) | nindent 12 }}
            {{- include "kchs.s3Env" (dict "ctx" .) | nindent 12 }}
            - name: S3_ENDPOINT
              value: {{ include "kchs.s3.endpoint" . | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_BUCKET_FILES
              value: {{ .Values.s3.buckets.files | quote }}
            - name: S3_BUCKET_PREVIEWS
              value: {{ .Values.s3.buckets.previews | quote }}
            - name: S3_BUCKET_EXPORTS
              value: {{ .Values.s3.buckets.exports | quote }}
            # Обратные вызовы движка в api и страница печати отчётов в web
            - name: KCHS_API_URL
              value: {{ include "kchs.api.url" . | quote }}
            - name: KCHS_WEB_URL
              value: {{ include "kchs.web.url" . | quote }}
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kchs.secretName" . }}
                  key: INTERNAL_SERVICE_TOKEN
            - name: ENGINE_PORT
              value: {{ .Values.engine.service.port | quote }}
            - name: ENGINE_CONCURRENCY
              value: {{ .Values.engine.concurrency | quote }}
            - name: ENGINE_TRANSCRIBE_MODEL
              value: {{ .Values.engine.transcribe.model | quote }}
            - name: ENGINE_TRANSCRIBE_DEVICE
              value: {{ .Values.engine.transcribe.device | quote }}
            - name: ENGINE_TRANSCRIBE_COMPUTE
              value: {{ .Values.engine.transcribe.compute | quote }}
            - name: ENGINE_TRANSCRIBE_LANGUAGE
              value: {{ .Values.engine.transcribe.language | quote }}
            - name: ENGINE_EMBEDDING_MODEL
              value: {{ .Values.engine.embedding.model | quote }}
            - name: ENGINE_COLUMNAR_CACHE_DIR
              value: {{ ternary .Values.engine.columnar.persistence.mountPath "" .Values.engine.columnar.persistence.enabled | quote }}
            - name: ENGINE_COLUMNAR_CACHE_MB
              value: {{ .Values.engine.columnar.cacheMb | quote }}
            - name: ENGINE_COLUMNAR_THREADS
              value: {{ .Values.engine.columnar.threads | quote }}
            - name: ENGINE_COLUMNAR_MEMORY_MB
              value: {{ .Values.engine.columnar.memoryMb | quote }}
            {{- with .Values.engine.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.engine.service.port }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.engine.columnar.persistence.enabled }}
            - name: columnar-cache
              mountPath: {{ .Values.engine.columnar.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.engine.columnar.persistence.enabled }}
        - name: columnar-cache
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                {{- with .Values.engine.columnar.persistence.storageClassName }}
                storageClassName: {{ . | quote }}
                {{- end }}
                resources:
                  requests:
                    storage: {{ .Values.engine.columnar.persistence.size }}
        {{- end }}
      {{- with .Values.engine.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-engine
  labels:
    {{- include "kchs.componentLabels" (dict "ctx" . "component" "engine") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.engine.service.port }}
      targetPort: http
  selector:
    {{- include "kchs.selectorLabels" (dict "ctx" . "component" "engine") | nindent 4 }}
{{- if eq $auto.mode "cpu" }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-engine
  labels:
    {{- include "kchs.componentLabels" (dict "ctx" . "component" "engine") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-engine
  minReplicas: {{ $auto.minReplicas }}
  maxReplicas: {{ $auto.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $auto.targetCPUUtilizationPercentage }}
{{- end }}
{{- if eq $auto.mode "keda" }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $fullname }}-engine
  labels:
    {{- include "kchs.componentLabels" (dict "ctx" . "component" "engine") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-engine
  minReplicaCount: {{ max 1 (int $auto.minReplicas) }}
  maxReplicaCount: {{ $auto.maxReplicas }}
  pollingInterval: {{ $auto.keda.pollingInterval }}
  cooldownPeriod: {{ $auto.keda.cooldownPeriod }}
  triggers:
    {{- if $auto.keda.triggers }}
    {{- toYaml $auto.keda.triggers | nindent 4 }}
    {{- else }}
    # Очереди движка (imports, transform, render, media, ai) считает метрика
    # ядра: её отдаёт worker, а не сам движок
    - type: prometheus
      metadata:
        serverAddress: {{ $auto.keda.prometheusAddress | quote }}
        metricName: kchs_engine_queue_jobs_waiting
        query: {{ printf "sum(kchs_queue_jobs{queue=~\"%s\",state=~\"waiting|prioritized\"})" (include "kchs.engineQueues" .) | quote }}
        threshold: {{ $auto.keda.jobsPerReplica | quote }}
    {{- end }}
{{- end }}
{{- end }}
