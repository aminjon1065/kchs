{{- if .Values.redisCache.embedded.enabled }}
{{/*
Встроенный кэш (ADR-0175) — второй Redis для того, что можно пересчитать: тайлы,
результаты запросов, наборы прав. allkeys-lru у предела вытесняет давно не
читанное, а не отказывает в записи; на диск не сохраняется (--save "" и без
AOF), поэтому Deployment без тома: перезапуск — пустой кэш, а не потеря данных.
*/}}
{{- $fullname := include "kchs.fullname" . -}}
{{- $cache := .Values.redisCache.embedded -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis-cache
  labels:
    {{- include "kchs.componentLabels" (dict "ctx" . "component" "redis-cache") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redisCache.port }}
      targetPort: redis
  selector:
    {{- include "kchs.selectorLabels" (dict "ctx" . "component" "redis-cache") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis-cache
  labels:
    {{- include "kchs.componentLabels" (dict "ctx" . "component" "redis-cache") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kchs.selectorLabels" (dict "ctx" . "component" "redis-cache") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kchs.componentLabels" (dict "ctx" . "component" "redis-cache") | nindent 8 }}
    spec:
      {{- include "kchs.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ include "kchs.image" (dict "ctx" . "image" $cache.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -ec
            - |
              exec redis-server \
                --save '' \
                --appendonly no \
                --maxmemory {{ $cache.maxmemory | quote }} \
                --maxmemory-policy allkeys-lru \
                --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kchs.secretName" . }}
                  key: REDIS_CACHE_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml $cache.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
      {{- with $cache.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cache.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cache.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
