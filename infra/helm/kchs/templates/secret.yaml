{{- if not .Values.secrets.existingSecret }}
{{/*
Secret установки. Значений по умолчанию у паролей нет: непереданный
обязательный ключ останавливает рендер, а не подставляет «admin».
Внешний менеджер (Vault, External Secrets, SealedSecrets) кладёт те же ключи в
свой Secret, и тогда чарту указывают secrets.existingSecret.
*/}}
{{- $v := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "kchs.fullname" .) }}
  labels:
    {{- include "kchs.labels" . | nindent 4 }}
  annotations:
    # Секрет переживает удаление релиза: иначе переустановка теряет ключ
    # шифрования KCHS_MASTER_KEY и данные, зашифрованные им
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.postgres.urlsFromSecret }}
  DATABASE_URL: {{ required "secrets.values.DATABASE_URL обязателен при postgres.urlsFromSecret" (get $v "DATABASE_URL") | quote }}
  DATABASE_MIGRATOR_URL: {{ required "secrets.values.DATABASE_MIGRATOR_URL обязателен при postgres.urlsFromSecret" (get $v "DATABASE_MIGRATOR_URL") | quote }}
  DATABASE_QUERY_URL: {{ required "secrets.values.DATABASE_QUERY_URL обязателен при postgres.urlsFromSecret" (get $v "DATABASE_QUERY_URL") | quote }}
  {{- else }}
  POSTGRES_APP_PASSWORD: {{ required "secrets.values.POSTGRES_APP_PASSWORD обязателен" (get $v "POSTGRES_APP_PASSWORD") | quote }}
  POSTGRES_MIGRATOR_PASSWORD: {{ required "secrets.values.POSTGRES_MIGRATOR_PASSWORD обязателен" (get $v "POSTGRES_MIGRATOR_PASSWORD") | quote }}
  POSTGRES_QUERY_PASSWORD: {{ required "secrets.values.POSTGRES_QUERY_PASSWORD обязателен" (get $v "POSTGRES_QUERY_PASSWORD") | quote }}
  {{- end }}
  {{- if .Values.redis.urlFromSecret }}
  REDIS_URL: {{ required "secrets.values.REDIS_URL обязателен при redis.urlFromSecret" (get $v "REDIS_URL") | quote }}
  {{- else }}
  REDIS_PASSWORD: {{ required "secrets.values.REDIS_PASSWORD обязателен" (get $v "REDIS_PASSWORD") | quote }}
  {{- end }}
  S3_ACCESS_KEY: {{ required "secrets.values.S3_ACCESS_KEY обязателен" (get $v "S3_ACCESS_KEY") | quote }}
  S3_SECRET_KEY: {{ required "secrets.values.S3_SECRET_KEY обязателен" (get $v "S3_SECRET_KEY") | quote }}
  MEILI_MASTER_KEY: {{ required "secrets.values.MEILI_MASTER_KEY обязателен" (get $v "MEILI_MASTER_KEY") | quote }}
  # 32 байта base64: шифрование секретов и TOTP (17-security.md §4)
  KCHS_MASTER_KEY: {{ required "secrets.values.KCHS_MASTER_KEY обязателен" (get $v "KCHS_MASTER_KEY") | quote }}
  INTERNAL_SERVICE_TOKEN: {{ required "secrets.values.INTERNAL_SERVICE_TOKEN обязателен" (get $v "INTERNAL_SERVICE_TOKEN") | quote }}
  {{- if .Values.postgres.embedded.enabled }}
  {{ .Values.postgres.embedded.superuserSecretKey }}: {{ required "secrets.values.POSTGRES_SUPERUSER_PASSWORD обязателен при встроенном Postgres" (get $v .Values.postgres.embedded.superuserSecretKey) | quote }}
  POSTGRES_READONLY_PASSWORD: {{ required "secrets.values.POSTGRES_READONLY_PASSWORD обязателен при встроенном Postgres" (get $v "POSTGRES_READONLY_PASSWORD") | quote }}
  POSTGRES_AUDIT_PASSWORD: {{ required "secrets.values.POSTGRES_AUDIT_PASSWORD обязателен при встроенном Postgres" (get $v "POSTGRES_AUDIT_PASSWORD") | quote }}
  {{- end }}
  {{- range $var, $key := .Values.secrets.optionalKeys }}
  {{- $value := get $v $var }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
