# Набор значений «секреты из внешнего менеджера» — чарт не создаёт Secret вовсе.
# Ключи в существующем Secret кладёт Vault Secrets Operator, External Secrets
# или SealedSecrets; строки подключения приходят готовыми (urlsFromSecret).
# Проверяет ветку шаблонов, которой нет в двух других наборах.

image:
  tag: "1.4.0"

baseUrl: https://kchs.gov.example

ingress:
  enabled: true
  className: traefik
  host: kchs.gov.example
  extraHosts:
    - kchs-old.gov.example
  tls:
    enabled: true
    secretName: kchs-gov-tls

global:
  imageRegistry: registry.gov.example
  imagePullSecrets: [registry-credentials]

secrets:
  existingSecret: kchs-platform

postgres:
  host: pgbouncer.kchs.svc.cluster.local
  urlsFromSecret: true

redis:
  host: redis.kchs.svc.cluster.local
  urlFromSecret: true

s3:
  endpoint: https://s3.gov.example
  publicEndpoint: https://s3.gov.example
  forcePathStyle: false

meilisearch:
  host: http://meilisearch.kchs.svc.cluster.local:7700

worker:
  autoscaling:
    mode: keda
    keda:
      # Свой триггер вместо собранного: длина очереди BullMQ прямо в Redis
      triggers:
        - type: redis
          metadata:
            address: redis.kchs.svc.cluster.local:6379
            listName: "bull:notify:wait"
            listLength: "50"
          authenticationRef:
            name: kchs-redis-auth

engine:
  autoscaling:
    mode: cpu
  columnar:
    persistence:
      enabled: true
      size: 100Gi

livekit:
  url: wss://meet.gov.example
  embedded:
    enabled: true
    udpService:
      type: LoadBalancer
      loadBalancerIP: 203.0.113.10
    ingress:
      enabled: true
      className: traefik
      host: meet.gov.example

observability:
  otlpEndpoint: http://otel-collector.observability.svc.cluster.local:4318
  serviceMonitor:
    enabled: true

cronJobs:
  - name: help
    schedule: "0 4 * * 0"
    args: ["help"]

extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: kchs-extra-note
    data:
      note: "манифест контура"
