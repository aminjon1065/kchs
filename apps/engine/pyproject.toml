[project]
name = "kchs-engine"
version = "0.1.0"
description = "Вычислительный движок kchs: импорт данных и геоданных, рендеринг, OCR, расшифровка, эмбеддинги"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "bullmq>=2.16",
    "redis>=6.4",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "structlog>=25.4",
    "boto3>=1.40",
    "pillow>=11.3",
    # XLSX: импорт пользователей (ADR-0041) и файлы данных
    "openpyxl>=3.1",
    # XLS (Excel 97–2003) в импорте датасетов (ADR-0046); чистый Python, без зависимостей
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
data = [
    "pandas>=2.3",
    "pyarrow>=21.0",
    "duckdb>=1.4",
]
gis = [
    "pyogrio>=0.11",
    "shapely>=2.1",
    "pyproj>=3.7",
]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "mypy>=1.18",
    # Тестовые книги .xls для импорта датасетов
    "xlwt>=1.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Кириллица в строках, докстрингах и комментариях — норма проекта, а не «похожие символы»
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `pytest` в образе (редактируемая установка) находит пакет так же, как `uv run pytest`
pythonpath = ["."]
markers = [
    "slow: долгие проверки производительности (запуск: pytest -m slow -s)",
    "s3: проверки с MinIO разработки (запуск: KCHS_TEST_S3=1 pytest -m s3)",
]
# По умолчанию (и в CI) — без долгих проверок и без внешнего хранилища
addopts = "-m 'not slow and not s3'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kchs_engine"]
