[project]
name = "kchs-engine"
version = "0.1.0"
description = "Вычислительный движок kchs: импорт данных и геоданных, рендеринг, OCR, расшифровка, эмбеддинги"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "bullmq>=2.16",
    "redis>=6.4",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "structlog>=25.4",
    "boto3>=1.40",
    "pillow>=11.3",
    # XLSX: импорт пользователей (ADR-0041) и файлы данных
    "openpyxl>=3.1",
    # XLS (Excel 97–2003) в импорте датасетов (ADR-0046); чистый Python, без зависимостей
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
data = [
    "pandas>=2.3",
    "pyarrow>=21.0",
    "duckdb>=1.4",
    # Пояса в результатах DuckDB (колоночный tier, ADR-0109); приходит и с pandas
    "pytz>=2025.1",
]
gis = [
    "pyogrio>=0.11",
    "shapely>=2.1",
    "pyproj>=3.7",
]
# Печать отчётов (ADR-0022, ADR-0078): страница печати веба в Chromium → PDF;
# DOCX — docxtpl (python-docx) с картинками графиков и карт со страницы печати.
# Печатные формы, штампы, водяные знаки и шаблоны документов (ADR-0085): pypdf
# накладывает страницу, напечатанную Chromium, на листы PDF
render = [
    "playwright>=1.55",
    "docxtpl>=0.20",
    "pypdf>=6.0",
]
# Расшифровка записей встреч (ADR-0092): CTranslate2-сборка Whisper, звук
# извлекает ffmpeg из образа. Без `ENGINE_TRANSCRIBE_MODEL` пакет не грузится.
media = [
    "faster-whisper>=1.2",
]
# Векторы для поиска по смыслу (ADR-0099): ONNX-сборка `bge-m3` через fastembed —
# без torch, работает на процессоре. Без `ENGINE_EMBEDDING_MODEL` пакет не грузится.
ai = [
    "fastembed>=0.7",
]
# Трассы (ADR-0167): OTLP/HTTP в коллектор, как у api. Без OTEL_EXPORTER_OTLP_ENDPOINT
# пакеты не импортируются
otel = [
    "opentelemetry-sdk>=1.37",
    "opentelemetry-exporter-otlp-proto-http>=1.37",
    "opentelemetry-instrumentation-fastapi>=0.58b0",
    "opentelemetry-instrumentation-httpx>=0.58b0",
]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "mypy>=1.18",
    # Тестовые книги .xls для импорта датасетов
    "xlwt>=1.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Кириллица в строках, докстрингах и комментариях — норма проекта, а не «похожие символы»
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `pytest` в образе (редактируемая установка) находит пакет так же, как `uv run pytest`
pythonpath = ["."]
markers = [
    "slow: долгие проверки производительности (запуск: pytest -m slow -s)",
    "s3: проверки с MinIO разработки (запуск: KCHS_TEST_S3=1 pytest -m s3)",
    "browser: печать в Chromium (образ движка или `playwright install chromium`; pytest -m browser)",
]
# По умолчанию (и в CI) — без долгих проверок, внешнего хранилища и браузера
addopts = "-m 'not slow and not s3 and not browser'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kchs_engine"]
