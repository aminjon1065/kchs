name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12'

jobs:
  static:
    name: "Статика: линт, типы, границы"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Линт (Biome)
        run: pnpm lint
      - name: Типы
        run: pnpm typecheck
      - name: Границы модулей
        run: pnpm deps:check
      - name: Полнота словарей i18n
        run: pnpm i18n:check
      - name: Тексты интерфейса только из словарей
        run: pnpm i18n:literals
      - name: Контраст токенов (WCAG AA)
        run: pnpm --filter @kchs/ui contrast
      - name: Токены соответствуют tokens.json
        run: |
          pnpm --filter @kchs/ui tokens
          git diff --exit-code packages/ui/src/tokens/tokens.css packages/ui/src/styles/theme.css
      - name: Контракты движка соответствуют packages/contracts
        run: |
          pnpm --filter @kchs/contracts gen:engine
          git diff --exit-code apps/engine/kchs_engine/contracts

  unit:
    name: Unit-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: Интеграционные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Секреты и инфраструктура
        run: |
          bash infra/scripts/generate-secrets.sh
          docker compose up -d --build --wait

      - name: Миграции и seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Интеграционные тесты API
        run: pnpm test:integration

      # ADR-0030: OpenAPI обязателен для внешних интеграций — собирается и проверяется
      - name: Спецификация OpenAPI
        run: pnpm openapi:gen
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json
          retention-days: 30

      - name: Логи при сбое
        if: failure()
        run: docker compose logs --tail=200

  e2e:
    name: Сквозные сценарии
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Секреты и инфраструктура
        run: |
          bash infra/scripts/generate-secrets.sh
          docker compose up -d --build --wait

      # Движок нужен сценариям с превью и текстом файлов: образ тяжёлый
      # (GDAL, LibreOffice, tesseract), поэтому — из общего кэша с заданием сборки
      - uses: docker/setup-buildx-action@v3
      - name: Образ движка
        uses: docker/build-push-action@v6
        with:
          context: apps/engine
          file: apps/engine/Dockerfile
          load: true
          tags: kchs/engine:0.1.0
          cache-from: type=gha,scope=engine

      - name: Миграции и seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Движок
        run: docker compose up -d --no-build --wait engine

      - name: Браузеры Playwright
        run: pnpm --filter @kchs/web exec playwright install --with-deps chromium

      - name: Поднять api и web
        run: |
          bash infra/scripts/dev-api.sh
          bash infra/scripts/dev-web.sh

      - name: Прогон сценариев
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  ui-visual:
    name: "Дизайн-система: снимки и доступность"
    runs-on: ubuntu-latest
    # Та же среда, что у `pnpm --filter @kchs/ui test:visual` локально: шрифты и
    # сглаживание совпадают со снимками. Версия образа = версия @playwright/test в packages/ui.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Сборка Storybook
        run: pnpm --filter @kchs/ui storybook:build
      - name: Снимки историй в двух темах и axe
        working-directory: packages/ui
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-visual-report
          path: packages/ui/playwright-report
          retention-days: 7

  build:
    name: Сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: kchs/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: kchs/web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: engine
        uses: docker/build-push-action@v6
        with:
          context: apps/engine
          file: apps/engine/Dockerfile
          push: false
          tags: kchs/engine:ci
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine

  engine-tests:
    name: Тесты движка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: '0.9.7' }
      - name: Тесты и линт
        working-directory: apps/engine
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run pytest

  security:
    name: Безопасность
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Уязвимости зависимостей
        run: pnpm audit --audit-level high
        continue-on-error: true
      - name: Trivy (файловая система)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table
